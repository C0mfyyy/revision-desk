<title>Revision Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Schibsted+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: app shell. Left rail = modules → tests tree; right = dashboard / module / test workspace. Rail becomes a drawer on phones. */
:root{
  --bg:#f2f4f9; --surface:#ffffff; --sunk:#e8ecf4; --ink:#141a2e; --muted:#58617d; --line:#d7ddea;
  --accent:#2343c8; --accent-ink:#ffffff; --accent-soft:#e2e7fb;
  --mark:#ffe36e; --mark-ink:#2e2600;
  --good:#1b7a48; --good-bg:#e0f3e7; --bad:#b4322c; --bad-bg:#fbe5e3; --warn:#9a5600;
  --c1:#2343c8; --c2:#8a3fb8; --c3:#b0601a; --c4:#1b7a48; --c5:#c23b6b; --c6:#0f7f8c;
  --display:'Schibsted Grotesk','Segoe UI',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
  --shadow:0 1px 2px rgba(20,26,46,.06),0 4px 14px rgba(20,26,46,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c0f1d; --surface:#151a2d; --sunk:#1d2339; --ink:#e8ebf6; --muted:#9ba4c2; --line:#2a3150;
    --accent:#8fa2ff; --accent-ink:#0b1030; --accent-soft:#232c55;
    --mark:#e6cf55; --mark-ink:#241e00;
    --good:#5fd394; --good-bg:#12301f; --bad:#f2908a; --bad-bg:#3a1a1a; --warn:#f0b35f;
    --c1:#8fa2ff; --c2:#c99af0; --c3:#f0a660; --c4:#5fd394; --c5:#f28bb0; --c6:#5fd0dc;
    --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c0f1d; --surface:#151a2d; --sunk:#1d2339; --ink:#e8ebf6; --muted:#9ba4c2; --line:#2a3150;
  --accent:#8fa2ff; --accent-ink:#0b1030; --accent-soft:#232c55;
  --mark:#e6cf55; --mark-ink:#241e00;
  --good:#5fd394; --good-bg:#12301f; --bad:#f2908a; --bad-bg:#3a1a1a; --warn:#f0b35f;
  --c1:#8fa2ff; --c2:#c99af0; --c3:#f0a660; --c4:#5fd394; --c5:#f28bb0; --c6:#5fd0dc;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.55}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15;letter-spacing:-.01em}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.shell{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;display:flex;flex-direction:column;padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:14px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 6px;text-align:left}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1rem;position:relative;overflow:hidden}
.brand .logo::after{content:"";position:absolute;left:5px;right:5px;bottom:9px;height:7px;background:var(--mark);opacity:.9;mix-blend-mode:normal;z-index:0}
.brand .logo span{position:relative;z-index:1;color:var(--bg)}
.brand b{font-family:var(--display);font-size:1.12rem;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:.8rem}
.navlink{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-radius:9px;padding:9px 10px;text-align:left;font-weight:700;color:var(--muted)}
.navlink:hover{background:var(--sunk);color:var(--ink)}
.navlink[aria-current="true"]{background:var(--accent-soft);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.navlink{transition:background .15s,color .15s}
.ttest[aria-current="true"]{color:var(--accent)}
.railhead{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:22px 10px 6px;display:flex;justify-content:space-between;align-items:center}
.railhead button{background:none;border:0;color:var(--accent);font-weight:700;font-size:.78rem;letter-spacing:0;text-transform:none;padding:2px 4px}
.tree{display:flex;flex-direction:column;gap:2px}
.tmod{font-weight:700}
.tmod .dot{width:10px;height:10px;border-radius:3px;background:var(--mc);flex:none}
.ttest{padding-left:30px;border-radius:0 9px 9px 0;margin-left:14px;width:calc(100% - 14px);border-left:1px solid var(--line);font-weight:400;font-size:.94rem;justify-content:space-between}
.ttest .when{font-size:.75rem;color:var(--muted);white-space:nowrap}
.railfoot{margin-top:auto;padding:14px 10px 0;font-size:.8rem;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.railfoot i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;margin-top:6px}
.railfoot i.ok{background:var(--good)} .railfoot i.warn{background:var(--warn)}

.main{min-width:0;padding-block:22px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.topbar{display:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.label{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hl{background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 92%,transparent 92%);padding:0 2px}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.crumbs button{background:none;border:0;padding:0;color:var(--accent);font-weight:700}
.pagehead{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:flex-end}
.pagehead h1{font-size:clamp(1.6rem,3.4vw,2.25rem);font-weight:800}

.btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:10px;padding:10px 16px;font-weight:700;line-height:1.2}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent);filter:none}
.btn.quiet{background:none;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:6px 11px;font-size:.88rem;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-weight:700;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;border-radius:6px;padding:2px 8px;background:color-mix(in srgb,var(--tc,var(--muted)) 13%,transparent);color:var(--tc,var(--muted));max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;border-radius:999px;padding:3px 10px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.pill.soon{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
.pill.past{color:var(--muted)}
.progress{height:7px;background:var(--sunk);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--pc,var(--accent));border-radius:99px;transition:width .3s}

.ring{--p:0;--rc:var(--accent);width:var(--sz,84px);height:var(--sz,84px);border-radius:50%;background:conic-gradient(var(--rc) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-items:center;flex:none}
.ring>span{width:calc(100% - 14px);height:calc(100% - 14px);border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:calc(var(--sz,84px)*.25)}

/* dashboard */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:center;background:var(--ink);color:var(--bg);border:0;border-radius:18px;padding:26px}
.hero .label{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.hero h2{font-size:clamp(1.4rem,3vw,1.9rem);font-weight:800;margin-top:6px}
.hero .sub{color:color-mix(in srgb,var(--bg) 75%,transparent);margin-top:4px}
.hero .big{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,6vw,3.6rem);line-height:1}
.hero .big em{font-style:normal;background:linear-gradient(transparent 60%,var(--mark) 60%,var(--mark) 90%,transparent 90%);color:var(--bg)}
.hero .ring{--rc:var(--mark)} .hero .ring>span{background:var(--ink);color:var(--bg)}
.hero .btn.ghost{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,transparent)}
.hero .btn{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-family:var(--display);font-size:1.7rem;font-weight:800;line-height:1.1;margin-top:4px}
.stat span{font-size:.85rem;color:var(--muted)}
.modgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.modcard{display:flex;flex-direction:column;gap:12px;border-top:5px solid var(--mc)}
.modcard h3{font-size:1.2rem}
.tline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;background:var(--sunk);border:0;border-radius:10px;padding:10px 12px;text-align:left;width:100%}
.tline:hover{outline:2px solid var(--accent);outline-offset:-2px}
.tline .progress{grid-column:1/-1;background:color-mix(in srgb,var(--surface) 70%,var(--sunk))}
.addcard{border:2px dashed var(--line);background:transparent;box-shadow:none;display:grid;place-items:center;text-align:center;min-height:160px;color:var(--muted);font-weight:700}
.addcard:hover{border-color:var(--accent);color:var(--accent)}
.activity{display:flex;flex-direction:column}
.act{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.act:first-child{border-top:0}
.act .sc{font-family:var(--display);font-weight:800}
.badge svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:.8rem;font-family:var(--display)}

/* test workspace */
.tabnav{position:sticky;top:max(8px,env(safe-area-inset-top,0px));z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:6px;scrollbar-width:none;padding:6px;background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.tabnav::-webkit-scrollbar{display:none}
.tgseg{display:flex;gap:2px;background:var(--sunk);border-radius:11px;padding:3px;flex:none}
.tabnav .tgseg button{padding:7px 12px;border-radius:8px;font-size:.86rem}
.tabnav .tgseg button[aria-current="true"],.tabnav .tgseg button[aria-current="true"]:hover{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,26,46,.12)}
.tgbtns{display:flex;gap:2px;flex-wrap:wrap;align-items:center;min-width:0;padding-left:6px;margin-left:2px;border-left:1px solid var(--line)}
.tabnav button{display:inline-flex;align-items:center;gap:7px;background:none;border:0;border-radius:10px;padding:8px 11px;font-weight:700;font-size:.9rem;color:var(--muted);white-space:nowrap;transition:background .15s,color .15s}
.tabnav button svg,.navlink svg{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabnav button.new{padding-right:8px}
@media (hover:hover){.tabnav button:hover{background:var(--sunk);color:var(--ink)}}
.tabnav button[aria-current="true"],.tabnav button[aria-current="true"]:hover{background:var(--accent);color:var(--accent-ink);box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 35%,transparent)}
.tabnav .n{font-size:.72rem;background:var(--sunk);border-radius:99px;padding:1px 7px;color:var(--muted);font-variant-numeric:tabular-nums}
.tabnav button[aria-current="true"] .n{background:color-mix(in srgb,var(--accent-ink) 22%,transparent);color:var(--accent-ink)}
.tabnav button.new::after{content:"New";font-size:.62rem;letter-spacing:.04em;text-transform:uppercase;background:var(--mark);color:var(--mark-ink);border-radius:5px;padding:1px 5px}
/* focus */
.focusbox{display:grid;gap:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 10%,var(--surface)),var(--surface) 60%)}
.focusbox textarea{min-height:92px;font-size:1.05rem;background:var(--surface)}
.fset{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.fset:first-child{border-top:0}
.fset h3{font-size:1.02rem}
.fset .row{grid-column:1/-1}
.fpreview .point{background:var(--bg)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.launch{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.launch:hover{border-color:var(--accent)}
.launch b{font-family:var(--display);font-size:1.05rem}
.launch span{color:var(--muted);font-size:.9rem}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 48px;gap:12px;align-items:center;font-size:.92rem}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--tc,var(--accent))}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}

.lessonlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.lesson{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:12px;padding:12px 14px}
.lesson:hover{border-color:var(--tc)}
.lesson .ck{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.72rem;color:#fff;margin-top:2px}
.lesson.done .ck{background:var(--good);border-color:var(--good)}
.lesson b{display:block}
.lesson span{font-size:.86rem;color:var(--muted)}
.subtabs{display:inline-flex;background:var(--sunk);border-radius:10px;padding:4px;gap:4px}
.subtabs button{background:none;border:0;border-radius:7px;padding:7px 14px;font-weight:700;color:var(--muted)}
.subtabs button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.point{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.point h3{font-size:1.04rem;margin-bottom:4px}
.point ul{margin:6px 0 0;padding-left:20px}
.recall .point .body{filter:blur(7px);user-select:none;cursor:pointer;transition:filter .2s}
.recall .point.open .body{filter:none;user-select:auto}
.recall .point:not(.open)::after{content:'Tap to reveal';display:block;font-size:.8rem;color:var(--muted);margin-top:6px}
.switch{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700}
.switch[aria-pressed="true"]{background:var(--tc);color:#fff;border-color:var(--tc)}
.switch.tg::before{content:"";width:30px;height:18px;border-radius:99px;background:var(--sunk);box-shadow:inset 0 0 0 2px var(--line);flex:none;transition:background .15s}
.switch.tg::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:var(--muted);margin-left:3px;transition:transform .15s}
.switch.tg{position:relative}
.switch.tg[aria-pressed="true"]::before{background:color-mix(in srgb,#fff 30%,transparent);box-shadow:none}
.switch.tg[aria-pressed="true"]::after{background:#fff;transform:translateX(12px)}
.vis{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 12px}
.step{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;font-weight:700;font-size:.93rem;display:flex;gap:8px;align-items:center;text-align:left}
.step i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-size:.75rem;flex:none}
.step[aria-pressed="true"]{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 12%,var(--surface))}
.step[aria-pressed="true"] i{background:var(--tc);color:#fff}
.stepdesc{border-left:4px solid var(--tc);background:color-mix(in srgb,var(--tc) 8%,var(--surface));padding:12px 14px;border-radius:0 8px 8px 0}

.fcwrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.flip{width:100%;max-width:560px;min-height:240px;perspective:1100px;background:none;border:0;padding:0}
.flip .in{position:relative;width:100%;min-height:240px;transition:transform .45s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);padding:26px 22px 22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-size:1.15rem;overflow:auto;box-shadow:var(--shadow);background-image:repeating-linear-gradient(transparent 0 31px,color-mix(in srgb,var(--line) 55%,transparent) 31px 32px)}
.face.back{transform:rotateY(180deg);border-color:var(--tc,var(--accent));background:color-mix(in srgb,var(--tc,var(--accent)) 8%,var(--surface));font-size:1.03rem}
.face small{position:absolute;top:10px;left:14px;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

.qtext{font-family:var(--display);font-size:1.28rem;font-weight:700;line-height:1.35;margin:10px 0 18px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:11px;padding:12px 14px}
@media (hover:hover){.opt:hover:not(:disabled):not(.sel){border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}}
.opt .k{flex:none;width:27px;height:27px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.85rem;font-weight:700;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--good);background:var(--good-bg)} .opt.ok .k{background:var(--good);border-color:var(--good);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-bg)} .opt.no .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.note{border-left:4px solid var(--accent);background:var(--accent-soft);padding:12px 14px;border-radius:0 9px 9px 0}
.whylist{margin-top:12px}
.whylist ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.whylist li{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.whylist li.mine{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:color-mix(in srgb,var(--bad-bg) 55%,var(--surface))}

<div class="shell">
  <nav class="rail" id="rail" aria-label="Modules and tests"></nav>
  <main class="main"><div class="wrap" id="main"></div></main>
</div>
<div id="overlay"></div>

<script>
/*SEED*/

/* ============ Built-in starter module (from the GEIT lessons + trainer) ============ */
const BUILTIN_MODULE = {id:'rais', name:'Responsible AI for Sustainability', code:'', color:1, created:1};
const BUILTIN_TEST_ID = 'geit-t14';
const BUILTIN_TEST = {
  id:BUILTIN_TEST_ID, moduleId:'rais', name:'Topics 1–4 Test', date:'', format:{mcq:15,sa:3}, created:1,
  topics:[{id:'1',name:'Governance, Responsible AI & Sustainability'},{id:'2',name:'GEIT Framework'},{id:'3',name:'Strategic Management'},{id:'4',name:'Benefits Realization'}],
  lessons: GEIT_PARTS.map(p=>({id:'b-'+p.id, topic:String(p.t), title:p.title, blurb:p.blurb, html:true, points:p.points,
    vis:[p.vis,p.vis2].filter(Boolean), cards:p.cards.map((c,i)=>({id:'b-'+p.id+'-c'+i,f:c[0],b:c[1]})), check:p.check})),
  mcq: GEIT_MCQ.map((m,i)=>({id:'b-q'+i, topic:String(m.t), q:m.q, o:m.o, a:m.a, e:m.e})),
  sa: GEIT_SA.map((s,i)=>({id:'b-s'+i, topic:String(s.t), q:s.q, model:s.model, pts:s.pts})),
  cards: []
};

/* ============ Helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const clone = o => o==null? o : JSON.parse(JSON.stringify(o));
const rid = p => p + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
const LET = ['A','B','C','D','E','F'];
const COLORS = ['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)'];
const pct = (a,b) => b? Math.round(a/b*100) : 0;
function plain(t){ // user text -> safe HTML with paragraphs and "- " bullets
  const lines = String(t||'').split(/\n/); let out='', ul=false;
  for(const ln of lines){ const m = ln.match(/^\s*[-•*]\s+(.*)/);
    if(m){ if(!ul){out+='<ul>';ul=true;} out+='<li>'+esc(m[1])+'</li>'; }
    else { if(ul){out+='</ul>';ul=false;} if(ln.trim()) out+='<p>'+esc(ln)+'</p>'; } }
  return out + (ul?'</ul>':'');
}
function today0(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function daysUntil(date){ if(!date) return null; const d=new Date(date+'T00:00:00'); if(isNaN(d)) return null; return Math.round((d-today0())/864e5); }
function whenLabel(date){ const n=daysUntil(date); if(n===null) return ''; if(n===0) return 'Today'; if(n===1) return 'Tomorrow'; if(n>1) return 'in '+n+' days'; if(n===-1) return 'Yesterday'; return (-n)+' days ago'; }
function datePill(date){ const n=daysUntil(date); if(n===null) return '<span class="pill past">No date set</span>';
  const f = new Date(date+'T00:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short'});
  return `<span class="pill ${n>=0&&n<=7?'soon':(n<0?'past':'')}">${esc(f)} · ${esc(whenLabel(date))}</span>`; }
function ago(ts){ const s=(Date.now()-ts)/1000; if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+' min ago'; if(s<86400) return Math.floor(s/3600)+' h ago'; const d=Math.floor(s/86400); return d===1?'yesterday':d+' days ago'; }

/* ============ Storage: account db when available, else this browser ============ */
const LS_KEY = 'revdesk.v1';
let docs = {}; let mode = 'connecting'; let col = null; let slowNote = false; let saveError = '';
let unsub = null, myId = null, localReason = '';   // localReason: 'signedout' | 'readonly'
const LOCAL_ONLY_KEY = LS_KEY + '.localOnly';
const dirty = {}, timers = {}, inflight = {};
function lsGet(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||'{}')||{}; }catch(e){ return {}; } }
function lsSet(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(docs)); }catch(e){} }
function put(id, data, delay){
  if(data===null) delete docs[id]; else docs[id]=data;
  dirty[id]=true; clearTimeout(timers[id]);
  timers[id]=setTimeout(()=>flush(id), delay||0);
}
async function flush(id){
  if(mode==='connecting') return;           // flushed once the store answers
  if(mode==='local'){ lsSet(); delete dirty[id]; return; }
  if(inflight[id]){ inflight[id].again=true; return; }
  inflight[id]={again:false};
  try{
    do{ inflight[id].again=false; const d=docs[id]; const ref=col.doc(id);
        if(d===undefined) await ref.delete(); else await ref.set(clone(d)); }
    while(inflight[id].again);
    delete dirty[id]; if(saveError){ saveError=''; renderRail(); }
  }catch(e){
    // the account store refused the write (view-only access on a shared page, or access withdrawn): keep the work in this browser instead
    if(e && ['invalid_argument','not_granted','revoked','capability_disabled','capability_removed'].includes(e.code)){ delete inflight[id]; switchToLocal(); return; }
    saveError = e && e.code==='quota_exceeded' ? 'Storage is full. Delete some tests to save more.' : 'Some changes could not be saved. They will retry on your next change.';
    renderRail();
  }finally{ delete inflight[id]; }
}
function goLocal(reason){ mode='local'; localReason=reason||'signedout'; const loc=lsGet(); for(const k in loc) if(!dirty[k]) docs[k]=loc[k]; lsSet(); for(const k in dirty) delete dirty[k]; render(); }
function switchToLocal(){
  if(mode==='local') return;
  try{ if(unsub) unsub(); }catch(e){}
  mode='local'; localReason='readonly'; saveError='';
  const loc=lsGet(); for(const k in loc) if(docs[k]===undefined && !dirty[k]) docs[k]=loc[k];   // keep what is on screen, add earlier browser saves
  lsSet(); for(const k in dirty) delete dirty[k];
  try{ if(myId) localStorage.setItem(LOCAL_ONLY_KEY, myId); }catch(e){}
  render(); toast('Saving in this browser instead');
}
async function initStore(){
  if(!window.claude || !window.claude.use){ goLocal(); return; }
  let db=null, user=null;
  try{ [db,user] = await Promise.all([claude.use('db'), claude.use('user')]); }catch(e){}
  const uid = user ? await user.id() : null;
  if(!db || !uid){ goLocal('signedout'); return; }
  myId = uid;
  let remembered=null; try{ remembered=localStorage.getItem(LOCAL_ONLY_KEY); }catch(e){}
  if(remembered===uid){ goLocal('readonly'); return; }   // this account was refused before on this page
  col = db.collection('data/users/'+uid);
  const timer = setTimeout(()=>{ if(mode==='connecting'){ slowNote=true; renderRail(); } }, 10000);
  unsub = col.onSnapshot(snap=>{
    const next={}; snap.docs.forEach(d=>{ if(d.exists) next[d.id]=d.data(); });
    for(const k in dirty){ if(docs[k]===undefined) delete next[k]; else next[k]=docs[k]; }
    docs = next;
    if(!snap.metadata.fromCache && mode==='connecting'){ mode='db'; slowNote=false; clearTimeout(timer); Object.keys(dirty).forEach(flush); }
    render();
  }, err=>{ clearTimeout(timer); slowNote=false; if(mode==='db') switchToLocal(); else goLocal(err&&err.code==='revoked'?'readonly':'signedout'); });
}

/* ============ Data model ============ */
function mergeTest(base, d, chunks){
  d = d||{}; const rm = new Set(d.removed||[]);
  const pick = k => [ ...((base&&base[k])||[]), ...(d[k]||[]), ...(chunks||[]).flatMap(c=>c[k]||[]) ].filter(x=>!rm.has(x.id));
  return { id:(base&&base.id)||d.id, moduleId:d.moduleId||(base&&base.moduleId), name:d.name||(base&&base.name)||'Untitled test',
    date:d.date!==undefined?d.date:((base&&base.date)||''), format:d.format||(base&&base.format)||{mcq:15,sa:3},
    topics:d.topics||(base&&base.topics)||[], lessons:pick('lessons'), mcq:pick('mcq'), sa:pick('sa'), cards:pick('cards'), traps:pick('traps'),
    builtin:!!base, created:d.created||(base&&base.created)||0, deleted:!!d.deleted };
}
function getModules(){
  const out=[]; const bo=docs['m_'+BUILTIN_MODULE.id];
  const bm = Object.assign({}, BUILTIN_MODULE, bo||{}); bm.builtin=true; if(!bm.deleted) out.push(bm);
  for(const k in docs){ if(k.startsWith('m_') && k!=='m_'+BUILTIN_MODULE.id){ const v=docs[k]; if(v && !v.deleted) out.push(Object.assign({},v,{id:k.slice(2)})); } }
  return out.sort((a,b)=>(a.created||0)-(b.created||0));
}
function getModule(mid){ return getModules().find(m=>m.id===mid); }
function getTests(){
  // generated content lives in chunk docs c_<testId>_<n> so no single doc grows past the store's size limit
  const ch={}; for(const k in docs){ if(k.startsWith('c_') && docs[k]){ const tid=k.slice(2,k.lastIndexOf('_')); (ch[tid]=ch[tid]||[]).push(docs[k]); } }
  for(const id in ch) ch[id].sort((a,b)=>(a.created||0)-(b.created||0));
  const out=[]; const bt = mergeTest(BUILTIN_TEST, docs['t_'+BUILTIN_TEST_ID], ch[BUILTIN_TEST_ID]); if(!bt.deleted) out.push(bt);
  for(const k in docs){ if(k.startsWith('t_') && k!=='t_'+BUILTIN_TEST_ID){ const v=docs[k]; if(v && !v.deleted) out.push(mergeTest(null, Object.assign({},v,{id:k.slice(2)}), ch[k.slice(2)])); } }
  const mods = new Set(getModules().map(m=>m.id));
  return out.filter(t=>mods.has(t.moduleId)).sort((a,b)=>(a.created||0)-(b.created||0));
}
function getTest(tid){ return getTests().find(t=>t.id===tid); }
function testsOf(mid){ return getTests().filter(t=>t.moduleId===mid); }
function editTest(tid, fn){ const d = clone(docs['t_'+tid]) || {}; fn(d); put('t_'+tid, d); }
function topicOf(test, id){ const i=test.topics.findIndex(t=>t.id===id); return i<0? {id, name:'General', c:'var(--muted)', n:''} : {id, name:test.topics[i].name, c:COLORS[i%COLORS.length], n:i+1}; }
function topicTag(test,id){ const t=topicOf(test,id); return `<span class="tag" style="--tc:${t.c}" title="${esc(t.name)}">${esc(t.name)}</span>`; }
function allCards(test){
  return [ ...test.lessons.flatMap(l=>(l.cards||[]).map(c=>({...c, topic:l.topic}))), ...test.cards ];
}
function prog(tid){ return docs['p_'+tid] || {mcq:{},cards:{},lessons:{},hist:[]}; }
function editProg(tid, fn, delay){ const p = clone(prog(tid)); p.mcq=p.mcq||{}; p.cards=p.cards||{}; p.lessons=p.lessons||{}; p.hist=p.hist||[]; fn(p); put('p_'+tid, p, delay===undefined?1200:delay); }
function readiness(test){
  const p = prog(test.id);
  const L = test.lessons.length ? test.lessons.filter(l=>p.lessons&&p.lessons[l.id]!==undefined).length/test.lessons.length : null;
  const Q = test.mcq.length ? test.mcq.filter(q=>p.mcq&&p.mcq[q.id]===1).length/test.mcq.length : null;
  const cards = allCards(test); const C = cards.length ? cards.filter(c=>p.cards&&p.cards[c.id]).length/cards.length : null;
  const parts=[]; if(L!==null) parts.push([L,1]); if(Q!==null) parts.push([Q,2]); if(C!==null) parts.push([C,1]);
  const w = parts.reduce((a,x)=>a+x[1],0);
  return { pct: w? Math.round(parts.reduce((a,x)=>a+x[0]*x[1],0)/w*100) : 0, L, Q, C };
}
function ring(p, sz){ return `<div class="ring" style="--p:${p};--sz:${sz||84}px" role="img" aria-label="${p}% ready"><span class="num">${p}%</span></div>`; }

/* ============ UI state ============ */
let ui = { page:'home', mid:null, tid:null, tab:'overview', lid:null, ltab:'learn', recall:false, open:{}, sel:{},
  fc:null, ck:null, deck:null, sess:null, setup:{topics:null,count:10}, addType:'mcq', modal:null, menu:false, toast:'', builds:{} };
let sampleFn = null;

function routeKey(){ return [ui.page,ui.mid,ui.tid,ui.tab,ui.lid,ui.ltab,ui.sess?ui.sess.i:'',ui.modal?ui.modal.kind:''].join('|'); }
function setHash(){ let h = ui.page==='home'?'home': ui.page==='module'?'m-'+ui.mid : 't-'+ui.tid+'--'+ui.tab; try{ if(location.hash.slice(1)!==h) history.replaceState(null,'','#'+h); }catch(e){} }
function readHash(){ const h=(location.hash||'').slice(1); if(h.startsWith('m-')){ ui.page='module'; ui.mid=h.slice(2); }
  else if(h.startsWith('t-')){ const [tid,tab]=h.slice(2).split('--'); ui.page='test'; ui.tid=tid; ui.tab=tab||'overview'; } }
function go(page, opts){ Object.assign(ui, {page, sess:null, lid:null, fc:null, ck:null, deck:null, menu:false}, opts||{});
  if(page==='test'){ const t=getTest(ui.tid); if(t) ui.mid=t.moduleId; }
  render(true); window.scrollTo(0,0); }
function toast(msg){ ui.toast=msg; renderOverlay(); clearTimeout(toast.t); toast.t=setTimeout(()=>{ui.toast='';renderOverlay();},2200); }

/* ============ Render: shell ============ */
let lastKey='';
function render(fresh){
  const key = routeKey(); const keep = !fresh && key===lastKey;
  const saved = {}; let focus=null, selS=null, selE=null;
  if(keep){ document.querySelectorAll('#main input[id]:not([type=file]), #main textarea[id], #main select[id]').forEach(el=>{ saved[el.id] = el.type==='radio'||el.type==='checkbox' ? el.checked : el.value; });
    const a=document.activeElement; if(a && a.id && saved[a.id]!==undefined){ focus=a.id; try{ selS=a.selectionStart; selE=a.selectionEnd; }catch(e){} } }
  lastKey = key;
  if(ui.page==='module' && !getModule(ui.mid)) ui.page='home';
  if(ui.page==='test' && !getTest(ui.tid)) ui.page = (mode==='connecting'?'test':'home');
  renderRail();
  const m = $('#main');
  const top = `<div class="topbar"><button class="btn ghost sm" data-act="menu" aria-expanded="${ui.menu}">☰ Modules</button><span class="label">Revision Desk</span></div>`;
  let body='';
  if(ui.page==='test' && !getTest(ui.tid)) body = `<div class="card empty"><h3>Loading your tests…</h3><p>Fetching your saved modules.</p></div>`;
  else body = ui.page==='home'? renderHome() : ui.page==='module'? renderModule() : renderTest();
  m.innerHTML = top + body;
  if(keep){ for(const id in saved){ const el=document.getElementById(id); if(!el) continue; if(el.type==='radio'||el.type==='checkbox') el.checked=saved[id]; else el.value=saved[id]; }
    if(focus){ const el=document.getElementById(focus); if(el){ el.focus(); try{ if(selS!=null) el.setSelectionRange(selS,selE); }catch(e){} } } }
  renderOverlay(); setHash();
  const tn=document.getElementById('tabnav'), ta=tn&&tn.querySelector('[aria-current="true"]');
  if(ta && (ta.offsetLeft<tn.scrollLeft || ta.offsetLeft+ta.offsetWidth>tn.scrollLeft+tn.clientWidth)) tn.scrollLeft=ta.offsetLeft-24;
}

function renderOverlay(){

/* ============ Dashboard ============ */
function streak(){
  const days = new Set(); getTests().forEach(t=>(prog(t.id).hist||[]).forEach(h=>{ const d=new Date(h.at); d.setHours(0,0,0,0); days.add(+d); }));
  let n=0, d=today0(); if(!days.has(+d)) d=new Date(+d-864e5);
  while(days.has(+d)){ n++; d=new Date(+d-864e5); } return n;
}

/* ---- Lessons ---- */
function renderLessons(t){
  if(!t.lessons.length) return emptyFor('lessons');
  if(ui.lid){ const l=t.lessons.find(x=>x.id===ui.lid); if(l) return renderLesson(t,l); ui.lid=null; }
  const p=prog(t.id); const nxt=t.lessons.find(l=>!(p.lessons&&p.lessons[l.id]!==undefined));
  let h = nxt? `<div class="card row between"><div><div class="label">Up next</div><b style="font-size:1.1rem">${esc(nxt.title)}</b></div><button class="btn" data-lesson="${esc(nxt.id)}">Start lesson</button></div>` : `<div class="card"><b>All lessons done.</b> <span class="muted">Revisit any of them to keep it fresh.</span></div>`;
  h += `<p class="muted small">Each lesson ends with a check of up to ${checkN(t)} questions, all about that lesson. <button class="btn quiet sm" data-tab="manage">Change how many</button></p>`;
  const groups = [...t.topics.map(tp=>tp.id), ...new Set(t.lessons.map(l=>l.topic).filter(id=>!t.topics.some(tp=>tp.id===id)))];
  groups.forEach(gid=>{ const ls=t.lessons.filter(l=>l.topic===gid); if(!ls.length) return; const tp=topicOf(t,gid);
    h += `<section class="stack" style="gap:10px"><div class="row between"><h2 style="font-size:1.1rem">${tp.n?`<span class="muted">Topic ${tp.n} · </span>`:''}${esc(tp.name)}</h2><span class="small muted num">${ls.filter(l=>p.lessons&&p.lessons[l.id]!==undefined).length}/${ls.length}</span></div>
      <div class="lessonlist">${ls.map(l=>{ const d=p.lessons&&p.lessons[l.id]!==undefined; return `<button class="lesson ${d?'done':''}" style="--tc:${tp.c}" data-lesson="${esc(l.id)}"><span class="ck">${d?'✓':''}</span><span><b>${esc(l.title)}</b><span>${esc(l.blurb||'')}</span></span></button>`; }).join('')}</div></section>`; });
  return h;
}
function stepsVis(key, v, c){ const i = ui.sel[key]!==undefined?ui.sel[key]:0;

const STOP = new Set('this that with from what which when where their there these those they them then than have has had will would should could about into over under such each other most more less many much only also both between within without because while being been were does done your yours ours which whose whom example following true false best describes describe statement statements company organisation organization'.split(' '));

      :`<p class="muted small">This test has no notes yet, so Claude uses standard textbook knowledge. <button class="btn quiet sm" data-tab="build">Add your materials</button> for answers that match your course.</p>`}
    <div class="row">${j.running?`<button class="btn" disabled><span class="spin"></span>${esc(j.stage)}</button><button class="btn ghost" data-act="fx-stop">Stop</button>`:`<button class="btn" data-act="fx-go" ${sampleFn?'':'disabled'}>Generate notes and questions</button><span class="muted small">Takes about a minute · uses your Claude usage</span>`}</div>
    ${j.error?`<div class="note" style="border-color:var(--bad);background:var(--bad-bg)">${esc(j.error)}</div>`:''}</section>`;
  const cur = j.key && sets.find(s=>s.key===j.key);
  if(cur) h += focusResult(t, cur);
  const rest = sets.filter(s=>!cur || s.key!==cur.key);
  if(rest.length) h += `<section class="card"><h2 style="font-size:1.15rem;margin-bottom:4px">Your focus sets</h2><p class="muted small">Everything here is also in Lessons, Practice, Flashcards and the mock test.</p><div style="margin-top:6px">${rest.map(s=>focusRow(t,s)).join('')}</div></section>`;
  else if(!cur && !j.running) h += `<div class="card empty"><h3>No focus sets yet</h3><p>Your focus sets show up here so you can practise them again.</p></div>`;
  return h;
}
function focusCounts(t,s){ const n={l:liveItems(t,s,'lessons').length, m:liveItems(t,s,'mcq').length, a:liveItems(t,s,'sa').length}; return n; }
function focusButtons(t,s,n){ return `${n.m?`<button class="btn sm" data-act="fx-practise" data-key="${esc(s.key)}">Practise ${n.m} MCQ</button>`:''}${n.l?`<button class="btn ghost sm" data-act="fx-lesson" data-key="${esc(s.key)}">Open lesson${n.l>1?'s':''}</button>`:''}${n.a?`<button class="btn ghost sm" data-act="fx-short" data-key="${esc(s.key)}">${n.a} short answer</button>`:''}<button class="btn quiet sm" data-act="fx-del" data-key="${esc(s.key)}">Delete</button>`; }

/* ---- Why each option is right or wrong ---- */
function hashStr(x){ let h=5381; for(let i=0;i<x.length;i++) h=((h<<5)+h+x.charCodeAt(i))|0; return (h>>>0).toString(36); }
const whyKey = (tid,q) => 'w_'+tid+'_'+(q.id||hashStr(q.q+'|'+(q.o||[]).join('|')));
function optWhy(tid,q){ if(!q) return null; if(Array.isArray(q.w) && q.w.length===q.o.length && q.w.some(Boolean)) return {why:'', w:q.w};
  const d=docs[whyKey(tid,q)]; return d && Array.isArray(d.w) && d.w.length===q.o.length ? d : null; }
const whyBusy = {};
function whyPrompt(q){ return `A student is revising with this multiple-choice question.
Question: ${q.q}
${q.o.map((x,i)=>LET[i]+'. '+x).join('\n')}
Correct answer: ${LET[q.a]}. ${q.o[q.a]}
${q.e?'Given explanation: '+q.e+'\n':''}Reply with only one JSON object: {"why":"one or two sentences on why the correct answer is right","w":[${q.o.map(()=>'"..."').join(',')}]}
"w" has one entry per option, in the order above: for each wrong option, one short sentence (under 25 words) on why it is wrong, such as what it actually describes or when it would be right; "" for the correct option. Keep the question's own terms. Plain text only.`; }
async function fetchWhy(tid,q){
  if(!q || !sampleFn || optWhy(tid,q)) return; const k=whyKey(tid,q); if(whyBusy[k]) return; whyBusy[k]='run';
  try{ const r=await sampleFn.json(whyPrompt(q), {cache:false});
    if(r && Array.isArray(r.w) && r.w.length===q.o.length){ put(k,{why:String(r.why||''), w:r.w.map(x=>String(x||'')), at:Date.now()}); delete whyBusy[k]; }
    else whyBusy[k]='fail';
  }catch(e){ whyBusy[k]='fail'; if(e&&(e.code==='not_granted'||e.code==='sampling_disabled')) sampleFn=null; }
  tick();
}
function whyBlock(tid, it, pick){
  const q=it.src, d=optWhy(tid,q), k=q&&whyKey(tid,q), good=it.opts[pick].ok, right=it.opts.find(o=>o.ok);
  const sum = it.e || (d&&d.why) || '';
  let h = `<div class="note why"><span class="verdict ${good?'ok':'no'}">${good?'Correct.':'Not quite.'}</span> ${good?'':`The answer is <b>${esc(right.t)}</b>. `}${esc(sum)}</div>`;
  const others = it.opts.map((o,j)=>({o,j})).filter(x=>!x.o.ok).sort((a,b)=>(b.j===pick)-(a.j===pick));
  if(d) h += `<div class="whylist"><div class="label">Why the other options are wrong</div><ul>${others.map(({o,j})=>`<li class="${j===pick?'mine':''}"><span class="k">${LET[j]}</span><div><b>${esc(o.t)}</b>${j===pick?' <span class="tag" style="--tc:var(--bad)">Your answer</span>':''}<div class="small">${esc(d.w[o.i]||'Not what the question describes.')}</div></div></li>`).join('')}</ul></div>`;
  else if(q && whyBusy[k]==='run') h += `<div class="whylist muted small"><span class="spin"></span>Explaining the other options…</div>`;
  else if(q && whyBusy[k]==='fail' && sampleFn) h += `<div class="whylist small"><button class="btn quiet sm" data-act="why-retry">Explain the other options</button></div>`;
  return h;
}

function mcqItem(q){ return {type:'mcq', id:q.id, topic:q.topic, q:q.q, e:q.e, src:q, opts:shuffle(q.o.map((x,i)=>({t:x,ok:i===q.a,i}))), pick:null}; }
function saItem(s){ return {type:'sa', id:s.id, topic:s.topic, q:s.q, model:s.model, pts:s.pts||[], text:'', shown:false, ticks:(s.pts||[]).map(()=>false)}; }
function startSess(kind, label, items, feedback){ if(!items.length) return; ui.sess={kind, label, items, i:0, feedback, done:false}; render(true); window.scrollTo(0,0); }
function mockPick(t){
  const by={}; shuffle(t.mcq).forEach(q=>{ (by[q.topic]=by[q.topic]||[]).push(q); });
  const keys=shuffle(Object.keys(by)); const out=[]; const n=Math.min(t.format.mcq,t.mcq.length);
  while(out.length<n){ for(const k of keys){ if(out.length>=n) break; if(by[k].length) out.push(by[k].shift()); } }
  return shuffle(out);
}
function renderItem(t){

function renderResults(t){
  const s=ui.sess, mcqs=s.items.filter(i=>i.type==='mcq'), sas=s.items.filter(i=>i.type==='sa');
  const right=mcqs.filter(i=>i.pick!==null&&i.opts[i.pick].ok).length;
  let h = `<div class="card"><div class="grid2">`;
  if(mcqs.length) h += `<div><div class="label">Multiple choice</div><div class="bigscore num">${right}/${mcqs.length}</div><div class="muted">${pct(right,mcqs.length)}%</div></div>`;
  if(sas.length){ const tot=sas.reduce((a,i)=>a+i.pts.length,0), got=sas.reduce((a,i)=>a+i.ticks.filter(Boolean).length,0);
    h += `<div><div class="label">Short-answer key points</div><div class="bigscore num">${got}/${tot}</div><div class="muted">${pct(got,tot)}% self-marked</div></div>`; }

  const wrong=mcqs.filter(i=>!(i.pick!==null&&i.opts[i.pick].ok));
  if(wrong.length) h += `<div class="card"><div class="label" style="margin-bottom:6px">Questions to revisit (${wrong.length})</div>${wrong.map(i=>`<div class="miss">${topicTag(t,i.topic)}<div style="font-weight:700;margin:6px 0">${esc(i.q)}</div>${i.pick!==null?`<div style="color:var(--bad)">Your answer: ${esc(i.opts[i.pick].t)}</div>${(d=>d&&d.w[i.opts[i.pick].i]?`<div class="muted small">Why it's wrong: ${esc(d.w[i.opts[i.pick].i])}</div>`:'')(optWhy(t.id,i.src))}`:'<div class="muted">Not answered</div>'}<div style="color:var(--good)">Correct: ${esc(i.opts.find(o=>o.ok).t)}</div><div class="muted small" style="margin-top:4px">${esc(i.e||'')}</div></div>`).join('')}</div>`;

function finishSess(){

  const tot=sas.reduce((a,i)=>a+i.pts.length,0), got=sas.reduce((a,i)=>a+i.ticks.filter(Boolean).length,0);
  editProg(t.id, p=>{

    if(all.length || sas.length){ p.hist.push({at:Date.now(), kind:s.label, score: all.length?right:got, n: all.length?all.length:tot}); p.hist=p.hist.slice(-40); }
    if(s.kind==='mock'){ const sa = tot?pct(got,tot):null; const b=p.best;

async function startBuild(tid){
  const b=build(tid); if(b.running || !sampleFn) return;
  const ready=b.files.filter(f=>f.status==='ready'); if(!ready.length) return;
  let lim=null; try{ lim=await sampleFn.limits(); }catch(e){}
  b.maxImg = lim&&lim.images ? lim.images.maxCount : 0;
  b.jobs=[];
  ready.forEach(f=>{ f.status='used';
    if(f.images&&f.images.length) b.jobs.push({id:rid('j'), name:f.name, ext:f.ext, text:f.text||'', images:f.images, stage:'Waiting', status:'queued'});
    else { const parts=splitText(f.text||'', 60000); parts.forEach((tx,i)=>b.jobs.push({id:rid('j'), name:f.name+(parts.length>1?` (part ${i+1} of ${parts.length})`:''), ext:f.ext, text:tx, stage:'Waiting', status:'queued'})); } });
  await runJobs(tid, b, b.jobs.slice());
}
async function runJobs(tid, b, list){
  b.running=true; b.ctl=new AbortController(); render();
  const queue=list.slice();
  const worker=async()=>{ while(queue.length && !b.ctl.signal.aborted){ await runJob(tid, b, queue.shift()); } };
  await Promise.all([worker(), worker()]);   // two files at a time
  b.jobs.forEach(j=>{ if(j.status==='queued'){ j.status='stopped'; j.stage='Stopped'; } });
  b.running=false; render();
  const ok=b.jobs.filter(j=>j.status==='done').length;
  if(ok && b.jobs.every(j=>j.status==='done')) toast('Your study materials are ready');
}
function renderBuild(t){
  const b=build(t.id); let h='';
  if(!sampleFn) h += `<div class="banner">Building from your files needs Claude, which isn't available in this view. Open the page on claude.ai while signed in. You can still add questions by hand in Manage content.</div>`;
  if(b.jobs){
    const total=b.jobs.length, done=b.jobs.filter(j=>j.status==='done').length, failed=b.jobs.filter(j=>j.status==='failed'||j.status==='stopped').length;
    h += `<section class="card stack"><div class="row between" style="align-items:flex-start"><div><h2 style="font-size:1.3rem">${b.running?'Building your study materials':done===total?'Your study materials are ready':'Build finished with problems'}</h2>
      <p class="muted small" style="margin-top:4px">${b.running?'About 1 to 3 minutes per file. It keeps going while this page is open, even if you switch tabs. Finished files are saved straight away.':`${done} of ${total} file${total>1?'s':''} built${failed?`, ${failed} need${failed>1?'':'s'} a retry`:''}.`}</p></div>
      ${b.running?'<button class="btn ghost" data-act="build-stop">Stop</button>':''}</div>
      <div class="progress"><i style="width:${pct(done,total)}%"></i></div>
      <div class="files">${b.jobs.map(j=>{ const cls=j.status==='done'?'ok':j.status==='running'?'run':(j.status==='failed'||j.status==='stopped')?'err':'';
        return `<div class="file"><span class="ftype">${esc(j.ext||'txt')}</span><div style="min-width:0"><div class="nm" title="${esc(j.name)}">${esc(j.name)}</div><div class="state ${cls}">${j.status==='running'?'<span class="spin"></span>':''}${esc(j.stage)}</div></div>
          ${(j.status==='failed'||j.status==='stopped')&&!b.running&&sampleFn?`<button class="btn ghost sm" data-act="job-retry" data-id="${esc(j.id)}">Retry</button>`:'<span></span>'}</div>`; }).join('')}</div>
      ${!b.running?`<div class="row">${done?'<button class="btn" data-tab="guide">Read the study guide</button><button class="btn ghost" data-tab="lessons">Start lessons</button><button class="btn ghost" data-tab="mock">Take a mock test</button>':''}<button class="btn quiet" data-act="build-clear">Add more materials</button></div>`:''}</section>`;
    return h;
  }
  const ready=b.files.filter(f=>f.status==='ready'), reading=b.files.some(f=>f.status==='reading');
  h += `<section class="card stack"><div><h2 style="font-size:1.3rem">Add study materials</h2><p class="muted" style="margin-top:4px">Upload your lecture slides, notes or readings. Claude reads them and writes this test's lessons, flashcards, study guide, exam traps, practice questions and short-answer questions.</p></div>
    <label class="drop"><input type="file" id="bfile" multiple accept=".pdf,.pptx,.docx,.txt,.md,image/*"><b>Drop files here, or choose files</b><span class="small">PDF, PowerPoint (.pptx), Word (.docx), text, or photos of your notes</span></label>
    ${b.files.length?`<div class="files">${b.files.map(f=>`<div class="file"><span class="ftype">${esc(f.ext||'txt')}</span><div style="min-width:0"><div class="nm" title="${esc(f.name)}">${esc(f.name)}</div><div class="state ${f.status==='ready'?'ok':f.status==='error'?'err':'run'}">${f.status==='reading'?'<span class="spin"></span>':''}${esc(f.note||'')}</div></div><button class="btn quiet sm" data-act="file-remove" data-id="${esc(f.id)}">Remove</button></div>`).join('')}</div>`:''}
    <label class="f">Or paste text <span class="hint">Notes, a reading, or text copied from slides</span><textarea id="bpaste-${t.id}" style="min-height:90px"></textarea></label>
    <div><button class="btn ghost sm" data-act="build-paste">Add pasted text</button></div>
    <div><div class="label">Practice questions per file</div><div class="row" style="margin-top:8px">${Object.entries(SIZES).map(([k,s])=>`<button class="chip" data-size="${k}" aria-pressed="${b.size===k}">${s.label} · ${s.mcq} MCQ + ${s.sa} short</button>`).join('')}</div></div>
    <div class="row"><button class="btn" data-act="build-start" ${ready.length&&sampleFn&&!reading?'':'disabled'}>Build study materials</button><span class="muted small">${ready.length} file${ready.length===1?'':'s'} ready · uses your Claude usage</span></div>
    <p class="muted small">Your files stay on this device. Only the text read from them, and page images of scanned slides, are sent to Claude. Check what it writes: it works only from your files, but it can still make mistakes.</p></section>`;
  return h;
}

    return `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mh"><form class="card stack" data-form="${m.kind}"><h2 id="mh" style="font-size:1.3rem">${m.kind==='newModule'?'New module':'Edit module'}</h2>

      <label class="f">Course code <span class="hint">Optional</span><input type="text" id="mm-code" value="${esc(md.code||'')}" placeholder="e.g. ICT3201"></label>
      <div class="row between"><div class="row"><button class="btn" type="submit">${m.kind==='newModule'?'Create module':'Save'}</button><button class="btn ghost" type="button" data-act="close-modal">Cancel</button></div>
      ${m.kind==='editModule'?'<button class="btn quiet sm" type="button" data-act="ask-del-module" style="color:var(--bad)">Delete module</button>':''}</div></form></div>`; }

      <label class="f">Test name<input type="text" id="mt-name" placeholder="e.g. Midterm, Quiz 2, Final exam" required></label>
      <label class="f">Test date <span class="hint">Optional, adds a countdown</span><input type="date" id="mt-date"></label>
      <div class="grid2"><label class="f">MCQs in the test<input type="number" id="mt-m" min="0" max="200" value="15"></label><label class="f">Short-answer questions<input type="number" id="mt-s" min="0" max="20" value="3"></label></div>
      <label class="f">Topics covered <span class="hint">Optional, one per line. Leave blank to let Claude name them from your files.</span><textarea id="mt-topics" style="min-height:80px" placeholder="Topic 5: Risk Optimization&#10;Topic 6: Resource Optimization"></textarea></label>
      <label class="row" style="gap:10px;font-weight:700;flex-wrap:nowrap;align-items:flex-start"><input type="checkbox" id="mt-build" checked style="width:18px;height:18px;margin-top:3px;accent-color:var(--accent);flex:none"><span>Build it from my study materials<span class="hint" style="display:block;font-weight:400;color:var(--muted);font-size:.85rem">Next, upload your slides or notes and Claude writes the lessons and questions.</span></span></label>
      <div class="row"><button class="btn" type="submit">Create test</button><button class="btn ghost" type="button" data-act="close-modal">Cancel</button></div></form></div>`;
  if(m.kind==='confirm') return `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mh"><div class="card stack"><h2 id="mh" style="font-size:1.25rem">${esc(m.title)}</h2><p>${esc(m.text)}</p>
      <div class="row"><button class="btn danger" data-act="${m.act}">${esc(m.ok)}</button><button class="btn ghost" data-act="close-modal">Cancel</button></div></div></div>`;
  return '';
}

/* ============ Events ============ */
function curTest(){ return ui.page==='test'? getTest(ui.tid) : null; }
document.addEventListener('submit', e=>{
  const f=e.target.closest('[data-form]'); if(!f) return; e.preventDefault();
  const kind=f.dataset.form;
  if(kind==='newModule'||kind==='editModule'){ const name=val('mm-name'), code=val('mm-code'); if(!name) return;
    if(kind==='newModule'){ const id=rid('m'); put('m_'+id, {name, code, color:getModules().length%COLORS.length, created:Date.now()}); ui.modal=null; go('module',{mid:id}); toast('Module created'); }
    else { const d=clone(docs['m_'+ui.mid])||{}; d.name=name; d.code=code; put('m_'+ui.mid,d); ui.modal=null; render(); toast('Saved'); } }
  if(kind==='newTest'){ const name=val('mt-name'); if(!name) return; const mid=ui.modal.mid; const id=rid('t');
    const topics=val('mt-topics').split('\n').map(s=>s.trim()).filter(Boolean).map(n=>({id:rid('tp'),name:n}));
    put('t_'+id, {moduleId:mid, name, date:val('mt-date'), format:{mcq:Math.max(0,+val('mt-m')||0), sa:Math.max(0,+val('mt-s')||0)}, topics, lessons:[], mcq:[], sa:[], cards:[], created:Date.now()});
    const fromFiles = !!(document.getElementById('mt-build')||{}).checked;
    ui.modal=null; go('test',{tid:id, tab:fromFiles?'build':'manage'}); toast(fromFiles?'Test created. Now add your study materials.':'Test created. Now add some content.'); }
});
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-go],[data-tab],[data-act],[data-lesson],[data-ltab],[data-step],[data-pt],[data-opt],[data-ckopt],[data-topic],[data-count],[data-addtype],[data-size],input[data-tick]');
  if(!el) return;
  const t = curTest();
  if(el.dataset.tick!==undefined){ ui.sess.items[ui.sess.i].ticks[+el.dataset.tick]=el.checked; return; }
  if(el.dataset.go){ const g=el.dataset.go; if(g==='home') go('home'); else if(g==='module') go('module',{mid:el.dataset.mid}); else go('test',{tid:el.dataset.tid, tab:el.dataset.tab||'overview'}); return; }
  if(el.dataset.tab){ Object.assign(ui,{tab:el.dataset.tab, sess:null, lid:null, deck:null, fc:null, ck:null}); render(true); window.scrollTo(0,0); return; }
  if(el.dataset.lesson){ Object.assign(ui,{lid:el.dataset.lesson, ltab:'learn', fc:null, ck:null, open:{}}); render(true); window.scrollTo(0,0); return; }
  if(el.dataset.ltab){ ui.ltab=el.dataset.ltab; render(true); window.scrollTo(0,0); return; }
  if(el.dataset.step){ const [k,j]=el.dataset.step.split('|'); ui.sel[k]=+j; render(); return; }
  if(el.dataset.pt){ if(ui.recall){ ui.open[el.dataset.pt]=!ui.open[el.dataset.pt]; render(); } return; }
  if(el.dataset.topic){ const id=el.dataset.topic, s=ui.setup.topics; s.has(id)?s.delete(id):s.add(id); if(!s.size) s.add(id); render(); return; }
  if(el.dataset.count!==undefined){ ui.setup.count=+el.dataset.count; render(); return; }
  if(el.dataset.addtype){ ui.addType=el.dataset.addtype; render(true); return; }
  if(el.dataset.size){ build(ui.tid).size=el.dataset.size; render(); return; }
  if(el.dataset.opt!==undefined){ pickOpt(+el.dataset.opt); return; }
  if(el.dataset.ckopt!==undefined){ const ck=ui.ck; if(!ck||ck.picked!==null) return; ck.picked=+el.dataset.ckopt; if(ck.qs[ck.i].opts[ck.picked].ok) ck.score++; render(); return; }
  act(el.dataset.act, el, t);
});
function pickOpt(i){ const s=ui.sess; if(!s||s.done) return; const it=s.items[s.i]; if(it.type!=='mcq'||i>=it.opts.length) return; if(s.feedback&&it.pick!==null) return;
  it.pick=i; if(s.feedback) editProg(ui.tid, p=>{ p.mcq[it.id]=it.opts[i].ok?1:0; }); render(); }
function nextItem(){ const s=ui.sess; const it=s.items[s.i]; if(it.type==='sa'&&!it.shown){ const ta=document.getElementById('sa-'+it.id+'-'+s.i); if(ta) it.text=ta.value; }
  if(s.i<s.items.length-1){ s.i++; render(true); window.scrollTo(0,0); } else finishSess(); }
function lessonDone(t, lid, score){ editProg(t.id, p=>{ if(p.lessons[lid]===undefined || score>p.lessons[lid]) p.lessons[lid]=score; }, 0); }
function act(a, el, t){
  const l = t && ui.lid ? t.lessons.find(x=>x.id===ui.lid) : null;
  switch(a){
    case 'menu': ui.menu=!ui.menu; renderRail(); renderOverlay(); break;
    case 'new-module': ui.menu=false; ui.modal={kind:'newModule'}; renderRail(); renderOverlay(); break;
    case 'edit-module': ui.modal={kind:'editModule'}; renderOverlay(); break;
    case 'new-test': ui.menu=false; ui.modal={kind:'newTest', mid:el.dataset.mid}; renderRail(); renderOverlay(); break;
    case 'close-modal': ui.modal=null; renderOverlay(); break;
    case 'ask-del-module': { const md=getModule(ui.mid); ui.modal={kind:'confirm', title:'Delete '+md.name+'?', text:'This deletes the module, its '+testsOf(md.id).length+' test(s) and all progress in them. This cannot be undone.', ok:'Delete module', act:'del-module'}; renderOverlay(); break; }
    case 'del-module': { const mid=ui.mid; testsOf(mid).forEach(x=>delTest(x.id)); if(mid===BUILTIN_MODULE.id) put('m_'+mid,{deleted:true}); else put('m_'+mid,null); ui.modal=null; go('home'); toast('Module deleted'); break; }
    case 'ask-del-test': ui.modal={kind:'confirm', title:'Delete '+t.name+'?', text:'This deletes the test, its content and your progress for it. This cannot be undone.', ok:'Delete test', act:'del-test'}; renderOverlay(); break;
    case 'del-test': { const mid=t.moduleId; delTest(t.id); ui.modal=null; go('module',{mid}); toast('Test deleted'); break; }
    case 'restore-builtin': put('m_'+BUILTIN_MODULE.id,null); put('t_'+BUILTIN_TEST_ID,null); render(); toast('Starter module restored'); break;
    case 'lessons-back': ui.lid=null; render(true); break;
    case 'recall': ui.recall=!ui.recall; ui.open={}; render(); break;
    case 'lesson-done': lessonDone(t, l.id, 0); render(); toast('Lesson marked done'); break;
    case 'flip': if(ui.deck&&ui.tab==='cards'&&!ui.lid) ui.deck.flipped=!ui.deck.flipped; else if(ui.fc) ui.fc.flipped=!ui.fc.flipped; render(); break;
    case 'fc-got': case 'fc-miss': {
      const good = a==='fc-got';
      if(ui.tab==='cards' && ui.deck && !ui.lid){ const d=ui.deck, id=d.order[d.i]; editProg(t.id,p=>{ if(good) p.cards[id]=1; else delete p.cards[id]; }); if(good) d.got++; else d.again.push(id); d.i++; d.flipped=false; }
      else { const fc=ui.fc, cd=l.cards[fc.order[fc.i]]; editProg(t.id,p=>{ if(good) p.cards[cd.id]=1; else delete p.cards[cd.id]; }); if(good) fc.got++; else fc.again.push(fc.order[fc.i]); fc.i++; fc.flipped=false; }
      render(); break; }
    case 'fc-again': fc_new(l.id, shuffle(ui.fc.again)); render(); break;
    case 'fc-restart': startFc(l); render(); break;
    case 'ck-next': { const ck=ui.ck; if(ck.i<ck.qs.length-1){ ck.i++; ck.picked=null; } else { ck.done=true; lessonDone(t,l.id,ck.score); editProg(t.id,p=>{ p.hist.push({at:Date.now(),kind:'Lesson check',score:ck.score,n:ck.qs.length}); p.hist=p.hist.slice(-40); }, 0); } render(); break; }
    case 'ck-retry': startCk(t,l); render(); break;
    case 'deck-start': { const p=prog(t.id); let pool=allCards(t).filter(c=>inTopics(t,c)); if(el.dataset.only) pool=pool.filter(c=>!(p.cards&&p.cards[c.id])); ui.deck={tid:t.id, order:shuffle(pool.map(c=>c.id)), i:0, flipped:false, got:0, again:[]}; render(true); break; }
    case 'deck-again': ui.deck={tid:t.id, order:shuffle(ui.deck.again), i:0, flipped:false, got:0, again:[]}; render(); break;
    case 'deck-exit': ui.deck=null; render(true); break;
    case 'start-practice': { let pool=shuffle(t.mcq.filter(q=>inTopics(t,q))); if(ui.setup.count) pool=pool.slice(0,ui.setup.count); startSess('practice','Practice',pool.map(mcqItem),true); break; }
    case 'start-mock': { const sa=shuffle(t.sa).slice(0,Math.min(t.format.sa,t.sa.length)); startSess('mock','Mock test',mockPick(t).map(mcqItem).concat(sa.map(saItem)),false); break; }
    case 'start-short': startSess('short','Short answer',shuffle(t.sa.filter(q=>inTopics(t,q))).map(saItem),false); break;
    case 'start-review': { const p=prog(t.id); startSess('review','Review',shuffle(t.mcq.filter(q=>p.mcq&&p.mcq[q.id]===0)).map(mcqItem),true); break; }
    case 'retry-wrong': { const ids=new Set(ui.sess.items.filter(i=>i.type==='mcq'&&!(i.pick!==null&&i.opts[i.pick].ok)).map(i=>i.id)); startSess('review','Review',shuffle(t.mcq.filter(q=>ids.has(q.id))).map(mcqItem),true); break; }
    case 'show-model': { const s=ui.sess, it=s.items[s.i]; const ta=document.getElementById('sa-'+it.id+'-'+s.i); if(ta) it.text=ta.value; it.shown=true; render(true); break; }
    case 'next': nextItem(); break;
    case 'quit': finishSess(); break;
    case 'sess-close': ui.sess=null; render(true); break;
    case 'save-details': { const name=val('ed-name-'+t.id)||t.name; editTest(t.id,d=>{ d.name=name; d.date=val('ed-date-'+t.id); d.format={mcq:Math.max(0,+val('ed-fm-'+t.id)||0), sa:Math.max(0,+val('ed-fs-'+t.id)||0), check:Math.min(20,Math.max(1,Math.round(+val('ed-fc-'+t.id)||5)))}; ui.ck=null; if(!d.moduleId) d.moduleId=t.moduleId; }); render(); toast('Details saved'); break; }
    case 'save-topics': { editTest(t.id,d=>{ d.topics=t.topics.map(tp=>({id:tp.id,name:val('tp-'+tp.id)||tp.name})); }); render(); toast('Topics saved'); break; }
    case 'add-topic': { const n=val('tp-new-'+t.id); if(!n) return; editTest(t.id,d=>{ d.topics=[...t.topics,{id:rid('tp'),name:n}]; }); render(true); toast('Topic added'); break; }
    case 'del-topic': { const id=el.dataset.id; editTest(t.id,d=>{ d.topics=t.topics.filter(x=>x.id!==id); }); render(true); break; }
    case 'del-item': { const kind=el.dataset.kind, id=el.dataset.id; editTest(t.id,d=>{ if((d[kind]||[]).some(x=>x.id===id)) d[kind]=d[kind].filter(x=>x.id!==id); else d.removed=[...(d.removed||[]),id]; if(!d.moduleId) d.moduleId=t.moduleId; }); render(); toast('Deleted'); break; }
    case 'add-mcq': { const q=val('a-mcq-q-'+t.id); const opts=[0,1,2,3].map(i=>val('a-mcq-o'+i+'-'+t.id)); let ai=[0,1,2,3].find(i=>{const r=document.getElementById('a-mcq-r'+i+'-'+t.id); return r&&r.checked;});
      const kept=[]; let a=-1; opts.forEach((o,i)=>{ if(o){ if(i===ai) a=kept.length; kept.push(o); } });
      if(!q||kept.length<2){ toast('Add a question and at least two options'); return; } if(a<0){ toast('Select the correct option'); return; }
      ingestOne(t,{mcq:[{q,o:kept,a,e:val('a-mcq-e-'+t.id)}]}, val('a-mcq-topic-'+t.id)); break; }
    case 'add-sa': { const q=val('a-sa-q-'+t.id); if(!q){ toast('Add a question'); return; } ingestOne(t,{sa:[{q,model:val('a-sa-m-'+t.id),pts:val('a-sa-p-'+t.id).split('\n').map(s=>s.trim()).filter(Boolean)}]}, val('a-sa-topic-'+t.id)); break; }
    case 'add-card': { const f=val('a-c-f-'+t.id), b=val('a-c-b-'+t.id); if(!f||!b){ toast('Fill in both sides'); return; } ingestOne(t,{cards:[{f,b}]}, val('a-c-topic-'+t.id)); break; }
    case 'add-lesson': { const title=val('a-l-t-'+t.id); if(!title){ toast('Give the lesson a title'); return; }
      const points=val('a-l-p-'+t.id).split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean).map(b=>{ const ls=b.split('\n'); return {h:ls[0], b:ls.slice(1).join('\n')}; });
      const cards=val('a-l-c-'+t.id).split('\n').map(x=>x.split('|')).filter(x=>x.length>=2&&x[0].trim()&&x[1].trim()).map(x=>[x[0].trim(),x.slice(1).join('|').trim()]);
      ingestOne(t,{lessons:[{title,blurb:val('a-l-s-'+t.id),points,cards,check:[]}]}, val('a-l-topic-'+t.id)); break; }
    case 'import': { let data; try{ data=JSON.parse(val('imp-'+t.id)); }catch(err){ toast('That is not valid JSON'); return; }
      if(Array.isArray(data)) data={mcq:data}; const n=ingest(t,data,true); if(n){ const el2=document.getElementById('imp-'+t.id); if(el2) el2.value=''; render(); toast('Imported '+n+' items'); } else toast('Nothing in that JSON matched the format'); break; }
    case 'copy-shape': { try{ navigator.clipboard.writeText(IMPORT_SHAPE).then(()=>toast('Format copied'),()=>toast('Select the text to copy it')); }catch(err){ toast('Select the text to copy it'); } break; }
    case 'why-retry': { const it = ui.sess&&!ui.sess.done ? ui.sess.items[ui.sess.i] : ui.ck&&ui.ck.qs[ui.ck.i]; if(it&&it.src){ delete whyBusy[whyKey(t.id,it.src)]; fetchWhy(t.id,it.src); render(); } break; }
    case 'fx-go': runFocus(t); break;
    case 'fx-stop': { const j=fjob(t.id); if(j.ctl) j.ctl.abort(); break; }
    case 'fx-size': fjob(t.id).size=el.dataset.v; render(); break;
    case 'fx-notes': { const j=fjob(t.id); j.notesOnly = j.notesOnly===false; render(); break; }
    case 'fx-suggest': { const ta=document.getElementById('fx-q-'+t.id); if(ta){ ta.value=el.dataset.v; ta.focus(); } break; }
    case 'fx-practise': { const s=docs[el.dataset.key]; if(s) startSess('practice','Focus: '+s.focus.ask.slice(0,40),shuffle(liveItems(t,s,'mcq')).map(mcqItem),true); break; }
    case 'fx-short': { const s=docs[el.dataset.key]; if(s) startSess('short','Focus: short answer',liveItems(t,s,'sa').map(saItem),false); break; }
    case 'fx-lesson': { const s=docs[el.dataset.key]; const l1=s&&liveItems(t,s,'lessons')[0]; if(l1){ Object.assign(ui,{tab:'lessons', lid:l1.id, ltab:'learn', fc:null, ck:null, open:{}}); render(true); window.scrollTo(0,0); } break; }
    case 'fx-del': { const k=el.dataset.key; ui.modal={kind:'confirm', title:'Delete this focus set?', text:'Removes its lessons, flashcards and questions from this test.', ok:'Delete', act:'fx-del-ok', key:k}; renderOverlay(); break; }
    case 'fx-del-ok': { const k=ui.modal&&ui.modal.key; if(k) put(k,null); const j=fjob(t.id); if(j.key===k) j.key=null; ui.modal=null; render(true); toast('Focus set deleted'); break; }
    case 'build-start': startBuild(t.id); break;
    case 'build-stop': { const b=build(t.id); if(b.ctl) b.ctl.abort(); break; }
    case 'build-clear': { const b=build(t.id); if(!b.running){ b.jobs=null; b.files=[]; } render(true); break; }
    case 'build-paste': { const ta=document.getElementById('bpaste-'+t.id); const tx=ta?ta.value.trim():''; if(tx.length<60){ toast('Paste at least a paragraph'); return; }
      const b=build(t.id); const st={id:rid('f'), name:'Pasted text '+(b.files.filter(f=>f.ext==='txt').length+1), ext:'txt', text:tx, status:'ready'}; st.note=fileNote(st); b.files.push(st); ta.value=''; render(); break; }
    case 'file-remove': { const b=build(t.id); b.files=b.files.filter(f=>f.id!==el.dataset.id); render(); break; }
    case 'job-retry': { const b=build(t.id); const j=b.jobs&&b.jobs.find(x=>x.id===el.dataset.id); if(j&&!b.running){ j.status='queued'; j.stage='Waiting'; runJobs(t.id, b, [j]); } break; }
  }
}
function ingestOne(t, data, topicId){ if(topicId) data.__topic=topicId; const n=ingest(t,data); if(n){ render(true); toast('Added'); } }
function delTest(tid){ if(tid===BUILTIN_TEST_ID) put('t_'+tid,{deleted:true}); else put('t_'+tid,null); put('p_'+tid,null);
  Object.keys(docs).forEach(k=>{ if(k.startsWith('c_'+tid+'_')||k.startsWith('w_'+tid+'_')) put(k,null); }); }
document.addEventListener('change', e=>{ if(e.target.id==='bfile' && ui.page==='test'){ const fs=[...e.target.files]; e.target.value=''; addFiles(ui.tid, fs); } });
const dropOf = e => e.target && e.target.closest ? e.target.closest('.drop') : null;
document.addEventListener('dragover', e=>{ const d=dropOf(e); if(d){ e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e=>{ const d=dropOf(e); if(d) d.classList.remove('over'); });
document.addEventListener('drop', e=>{ const d=dropOf(e); if(d){ e.preventDefault(); d.classList.remove('over'); if(e.dataTransfer&&e.dataTransfer.files.length) addFiles(ui.tid, [...e.dataTransfer.files]); } });

document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && (ui.modal||ui.menu)){ ui.modal=null; ui.menu=false; renderRail(); renderOverlay(); return; }
  const tag=(document.activeElement||{}).tagName; if(tag==='TEXTAREA'||tag==='INPUT'||tag==='SELECT'||ui.modal) return;
  const s=ui.sess;
  if(s && !s.done){ const it=s.items[s.i]; if(it.type!=='mcq') return;
    if(e.key>='1'&&e.key<='6'){ pickOpt(+e.key-1); } else if(e.key==='Enter'&&it.pick!==null&&tag!=='BUTTON'){ e.preventDefault(); nextItem(); } return; }
  if((e.key===' '||e.code==='Space') && tag!=='BUTTON'){
    const deckOn = ui.tab==='cards'&&ui.deck&&!ui.lid&&ui.deck.i<ui.deck.order.length; const fcOn = ui.lid&&ui.ltab==='cards'&&ui.fc&&ui.fc.i<ui.fc.order.length;
    if(deckOn){ e.preventDefault(); ui.deck.flipped=!ui.deck.flipped; render(); } else if(fcOn){ e.preventDefault(); ui.fc.flipped=!ui.fc.flipped; render(); }
  }
});
window.addEventListener('hashchange', ()=>{ const before=routeKey(); readHash(); if(routeKey()!==before){ ui.sess=null; render(true); } });

/* ============ Boot ============ */
readHash();
render(true);
initStore();
(async()=>{ try{ if(window.claude&&window.claude.use){ sampleFn = await claude.use('sample'); if(ui.page==='test') render(); } }catch(e){} })();
</script>
